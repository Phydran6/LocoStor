# Dependency updates are proposed daily and merged automatically once CI
# passes (see dependabot-merge.yml). Major versions need a human.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      go:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: daily
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      web:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
