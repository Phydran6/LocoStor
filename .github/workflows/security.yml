name: Security

# Every day: check the latest release binary and the source for known
# vulnerabilities (Go standard library and modules). If the release is
# affected, build a patch release automatically with the newest Go patch
# version and updated dependencies. Installations pick it up with their
# daily automatic update.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build a patch release even without findings
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      vulnerable: ${{ steps.binary.outputs.vulnerable }}
      ids: ${{ steps.binary.outputs.ids }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan the latest release binary
        id: binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern locostor-linux-amd64 --dir rel 2>/dev/null; then
            echo "no release yet"; echo "vulnerable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          set +e
          govulncheck -mode=binary -format json rel/locostor-linux-amd64 > vulns.json
          set -e
          # Findings with a trace are vulnerabilities that are really in the binary.
          ids=$(jq -r 'select(.finding != null) | .finding.osv' vulns.json | sort -u | tr '\n' ' ')
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          if [ -n "$ids" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Latest release is affected by: ${ids:-forced rebuild}"
          else
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan the source
        run: govulncheck ./... || true

  patch:
    needs: scan
    if: needs.scan.outputs.vulnerable == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Update Go modules
        run: |
          go get -u ./...
          go mod tidy
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          go vet ./...
          go test ./...

      - name: Next patch version
        id: tag
        run: |
          last=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v -- - | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v$major.$minor.$((patch + 1))"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - name: Changelog, commit and tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IDS: ${{ needs.scan.outputs.ids }}
        run: |
          gover=$(go env GOVERSION)
          entry="## [$VERSION] - $(date -u +%Y-%m-%d)\n\n### Security\n\n- Automatic security release: rebuilt with $gover and updated Go modules${IDS:+ (fixes: $IDS)}\n"
          awk -v e="$entry" '/^## \[Unreleased\]/ { print; print ""; printf "%s", e; next } { print }' CHANGELOG.md > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Security release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

  release:
    needs: patch
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.patch.outputs.tag }}
    secrets: inherit

  report:
    needs: [scan, patch]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ needs.scan.outputs.ids }}
        run: |
          title="Security: automatic patch release failed"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then exit 0; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "The latest release is affected by: ${IDS:-unknown}. Updating Go and the modules was not enough or a test failed – see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
