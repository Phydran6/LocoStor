name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: Tag to release (used by the security workflow)
        type: string
        required: true
  # Actions → Release → Run workflow: tags the selected branch and releases it.
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, e.g. v0.5.0
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || inputs.tag || github.ref }}

      - name: Create the tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "tag must look like v1.2.3"; exit 1 ;; esac
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG exists already - releasing it"
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout -q "$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "LocoStor $TAG"
            git push origin "$TAG"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      # Always the newest Go patch release, so fixes in the standard
      # library reach every build.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          # Optional app registrations for "Sign in with Microsoft/Google"
          # in the e-mail assistant (repository variables / secrets).
          MS_CLIENT_ID: ${{ vars.LOCOSTOR_MS_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.LOCOSTOR_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCOSTOR_GOOGLE_CLIENT_SECRET }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.msClientID=$MS_CLIENT_ID -X main.googleClientID=$GOOGLE_CLIENT_ID -X main.googleClientSecret=$GOOGLE_CLIENT_SECRET" \
              -o "dist/locostor-linux-$arch" ./cmd/locostor
          done
          cd dist && sha256sum locostor-linux-* > SHA256SUMS

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## \[/ { if (p) exit; if (index($0, "## [" v "]") == 1) { p = 1; next } }
            p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $TAG" > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag $PRERELEASE
