name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal web)" || (gofmt -l cmd internal web; exit 1)

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: ShellCheck installer
        run: shellcheck -s sh -S warning scripts/install.sh

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o locostor ./cmd/locostor
